version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
